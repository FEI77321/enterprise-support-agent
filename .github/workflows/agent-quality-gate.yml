name: Agent Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-regression:
    name: Backend regression gate
    runs-on: ubuntu-latest
    env:
      ENABLE_LLM_ANSWER: "false"
      LLM_PROVIDER: stub
      TOOL_CALL_PROVIDER: mock
      REDIS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      TRACE_PERSISTENCE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Run Agent regression gate
        run: python eval/run_ci_quality_gate.py

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
